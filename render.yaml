# ──────────────────────────────────────────────────────────────────
# Render Blueprint — Deploy do Frontend Arandu
# ──────────────────────────────────────────────────────────────────
# A API roda no Fly.io (https://arandu-api.fly.dev).
# Este blueprint configura apenas o Frontend (React + Vite) no Render,
# apontando para a API no Fly.io.
#
# Uso: New + → Blueprint → Conecte o repositório GitHub
# ──────────────────────────────────────────────────────────────────

services:
  # ────────────────────────────────────────────────────────────────
  # Frontend — React + Vite (Static Site)
  # ────────────────────────────────────────────────────────────────
  - type: web
    name: arandu-frontend
    env: static
    region: ohio
    buildCommand: yarn install && npx turbo run build --filter=frontend
    staticPublishPath: ./apps/frontend/dist
    # ── Build Filters (evita build quando só a API mudou) ──
    filters:
      - paths:
          - apps/frontend/**
          - package.json
          - yarn.lock
          - turbo.json
    # ── SPA Fallback — React Router ──
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # ── Variáveis de Ambiente ──
    envVars:
      - key: VITE_API_URL
        value: https://arandu-api.fly.dev/api
